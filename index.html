<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>可轉債篩選器</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, 'Noto Sans TC', sans-serif; background: #0a0e17; color: #e2e8f0; }

  .header { border-bottom: 1px solid #1e293b; background: rgba(10,14,23,0.9); backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 50; }
  .header-inner { max-width: 1200px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
  .title { font-size: 18px; font-weight: 600; }
  .title span { color: #22d3ee; margin-right: 6px; }
  .subtitle { font-size: 11px; color: #64748b; margin-top: 2px; }
  .badge { font-size: 11px; padding: 3px 10px; border-radius: 6px; background: #1e293b; color: #94a3b8; border: 1px solid #334155; }

  .container { max-width: 1200px; margin: 0 auto; padding: 16px; }

  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tab { padding: 6px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid #1e293b; background: #0f172a; color: #64748b; transition: all 0.2s; }
  .tab:hover { color: #cbd5e1; border-color: #334155; }
  .tab.active { background: rgba(34,211,238,0.1); color: #22d3ee; border-color: rgba(34,211,238,0.3); }
  .tab-count { margin-left: 6px; font-size: 11px; opacity: 0.6; }

  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }

  .search-box { position: relative; width: 220px; }
  .search-box input { width: 100%; background: #0f172a; border: 1px solid #1e293b; border-radius: 8px; padding: 6px 10px 6px 30px; font-size: 13px; color: #cbd5e1; outline: none; transition: border-color 0.2s; }
  .search-box input::placeholder { color: #475569; }
  .search-box input:focus { border-color: rgba(34,211,238,0.4); }
  .search-icon { position: absolute; left: 9px; top: 8px; width: 14px; height: 14px; color: #475569; }

  /* ── Slider panel ── */
  .filter-panel { background: rgba(15,23,42,0.6); border: 1px solid rgba(30,41,59,0.7); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px 24px; }
  .filter-row { display: flex; flex-direction: column; gap: 6px; }
  .filter-label { font-size: 11px; color: #64748b; display: flex; justify-content: space-between; align-items: center; }
  .filter-label span { color: #22d3ee; font-variant-numeric: tabular-nums; font-size: 12px; font-weight: 500; }
  .dual-slider { position: relative; height: 28px; display: flex; align-items: center; }
  .slider-track { position: absolute; left: 0; right: 0; height: 3px; background: #1e293b; border-radius: 2px; pointer-events: none; }
  .slider-fill { position: absolute; height: 3px; background: #22d3ee; border-radius: 2px; pointer-events: none; }
  .dual-slider input[type=range] {
    position: absolute; width: 100%; appearance: none; -webkit-appearance: none;
    background: transparent; pointer-events: none; height: 3px;
  }
  .dual-slider input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px;
    border-radius: 50%; background: #22d3ee; cursor: pointer;
    pointer-events: all; border: 2px solid #0a0e17;
    transition: transform 0.15s;
  }
  .dual-slider input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }
  .dual-slider input[type=range]::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%;
    background: #22d3ee; cursor: pointer; pointer-events: all;
    border: 2px solid #0a0e17;
  }
  .single-slider { display: flex; align-items: center; gap: 0; }
  .single-slider input[type=range] {
    flex: 1; appearance: none; -webkit-appearance: none;
    height: 3px; background: linear-gradient(to right, #22d3ee var(--pct,0%), #1e293b var(--pct,0%));
    border-radius: 2px; cursor: pointer;
  }
  .single-slider input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px;
    border-radius: 50%; background: #22d3ee; cursor: pointer;
    border: 2px solid #0a0e17; transition: transform 0.15s;
  }
  .single-slider input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }
  .single-slider input[type=range]::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%;
    background: #22d3ee; cursor: pointer; border: 2px solid #0a0e17;
  }
  .reset-btn { font-size: 11px; color: #475569; background: none; border: none; cursor: pointer; padding: 2px 6px; border-radius: 4px; transition: color 0.15s; white-space: nowrap; }
  .reset-btn:hover { color: #94a3b8; }
  .filter-panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
  .filter-toggle { font-size: 12px; color: #475569; background: none; border: none; cursor: pointer; display: flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 6px; transition: all 0.15s; }
  .filter-toggle:hover { color: #94a3b8; background: rgba(30,41,59,0.4); }
  .filter-toggle.active { color: #22d3ee; }

  .legend { display: flex; gap: 14px; font-size: 11px; color: #64748b; margin-bottom: 12px; }
  .legend-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }

  .table-wrap { background: rgba(15,23,42,0.5); border: 1px solid rgba(30,41,59,0.6); border-radius: 12px; overflow: hidden; }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th { padding: 8px 10px; text-align: left; font-size: 11px; font-weight: 500; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; border-bottom: 1px solid rgba(30,41,59,0.8); user-select: none; }
  thead th.sortable { cursor: pointer; }
  thead th.sortable:hover { color: #cbd5e1; }
  thead th.num { text-align: right; }
  tbody td { padding: 7px 10px; white-space: nowrap; border-bottom: 1px solid rgba(30,41,59,0.3); }
  tbody td.num { text-align: right; font-variant-numeric: tabular-nums; }
  tbody tr:hover { background: rgba(30,41,59,0.3); }
  tbody tr.premium-neg { background: rgba(16,185,129,0.04); }
  tbody tr.premium-low { background: rgba(245,158,11,0.04); }
  tbody tr.premium-high { background: rgba(244,63,94,0.04); }

  .code { font-family: 'SF Mono', 'Menlo', monospace; font-weight: 600; color: #e2e8f0; }
  .color-green { color: #34d399; }
  .color-amber { color: #fbbf24; }
  .color-red { color: #fb7185; }
  .color-gray { color: #64748b; }
  .sort-arrow { margin-left: 3px; color: #22d3ee; }
  .sort-arrow-dim { margin-left: 3px; opacity: 0.2; }

  .footer { margin-top: 24px; text-align: center; font-size: 11px; color: #475569; line-height: 1.8; padding-bottom: 24px; }

  .loading { min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; }
  .spinner { width: 28px; height: 28px; border: 2px solid #22d3ee; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error-box { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .error-card { background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 32px; max-width: 400px; text-align: center; }
  .error-card .icon { font-size: 36px; margin-bottom: 12px; }
  .error-card p { font-size: 13px; color: #94a3b8; line-height: 1.6; }

  .empty { padding: 48px 10px; text-align: center; color: #475569; }

  @media (max-width: 640px) {
    .search-box { width: 100%; }
    .toolbar { flex-direction: column; align-items: stretch; }
    .filter-panel { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

const DATA_URL = "./data/latest.json";

const COLUMNS = [
  { key: "代號", label: "代號", sortable: true },
  { key: "債券名稱", label: "名稱", sortable: true },
  { key: "債券市價", label: "CB價", sortable: true, num: true },
  { key: "溢價率", label: "溢價率", sortable: true, num: true, fmt: "pct" },
  { key: "標的股價", label: "股價", sortable: true, num: true },
  { key: "轉換價格", label: "轉換價", sortable: true, num: true },
  { key: "轉換價值", label: "轉換價值", sortable: true, num: true },
  { key: "CB成交量", label: "成交量", sortable: true, num: true },
  { key: "CB均量5日", label: "5日均量", sortable: true, num: true },
  { key: "CB均量20日", label: "20日均量", sortable: true, num: true },
  { key: "到期日", label: "到期日", sortable: true },
  { key: "MA87", label: "87MA", sortable: true, num: true },
  { key: "MA284", label: "284MA", sortable: true, num: true },
  { key: "有擔保", label: "擔保" },
];

function fmtVal(v, fmt) {
  if (v == null || v === "" || (typeof v === "number" && isNaN(v))) return "—";
  if (fmt === "pct") return (v * 100).toFixed(1) + "%";
  if (typeof v === "number") return v.toLocaleString("zh-TW", { maximumFractionDigits: 2 });
  return String(v);
}

function premColor(r) {
  if (r == null || isNaN(r)) return "color-gray";
  if (r < 0) return "color-green";
  if (r < 0.05) return "color-amber";
  return "color-red";
}

function premRowClass(r) {
  if (r == null || isNaN(r)) return "";
  if (r < 0) return "premium-neg";
  if (r < 0.05) return "premium-low";
  return "premium-high";
}

/* ── Dual range slider ── */
function DualSlider({ min, max, step=1, valMin, valMax, onChange, fmtLabel }) {
  const trackRef = useRef(null);

  const pctMin = ((valMin - min) / (max - min)) * 100;
  const pctMax = ((valMax - min) / (max - min)) * 100;

  const handleMin = e => {
    const v = Math.min(Number(e.target.value), valMax - step);
    onChange([v, valMax]);
  };
  const handleMax = e => {
    const v = Math.max(Number(e.target.value), valMin + step);
    onChange([valMin, v]);
  };

  const label = fmtLabel ? fmtLabel(valMin, valMax) : `${valMin} ~ ${valMax}`;

  return (
    <div className="filter-row">
      <div className="filter-label">
        <span style={{color:"#94a3b8"}}>{fmtLabel ? "" : ""}</span>
        <span>{label}</span>
      </div>
      <div className="dual-slider">
        <div className="slider-track" />
        <div className="slider-fill" style={{left: pctMin+"%", right: (100-pctMax)+"%"}} />
        <input type="range" min={min} max={max} step={step} value={valMin} onChange={handleMin} />
        <input type="range" min={min} max={max} step={step} value={valMax} onChange={handleMax} />
      </div>
    </div>
  );
}

/* ── Single min slider ── */
function MinSlider({ min, max, step=1, value, onChange, fmtLabel }) {
  const pct = ((value - min) / (max - min)) * 100;
  const label = fmtLabel ? fmtLabel(value) : value;
  return (
    <div className="filter-row">
      <div className="filter-label">
        <span style={{color:"#94a3b8"}}></span>
        <span>{label}</span>
      </div>
      <div className="single-slider">
        <input
          type="range" min={min} max={max} step={step} value={value}
          style={{"--pct": pct+"%"}}
          onChange={e => onChange(Number(e.target.value))}
        />
      </div>
    </div>
  );
}

/* ── Filter panel ── */
const DEFAULT_FILTERS = {
  premMin: -20, premMax: 50,
  cbMin: 80,    cbMax: 200,
  vol5Min: 0,
};

function FilterPanel({ filters, setFilters, rawData }) {
  const reset = () => setFilters(DEFAULT_FILTERS);

  const hasChange = JSON.stringify(filters) !== JSON.stringify(DEFAULT_FILTERS);

  return (
    <div className="filter-panel">
      {/* 溢價率 */}
      <div>
        <div className="filter-label" style={{marginBottom:4}}>
          溢價率範圍
          <button className="reset-btn" onClick={() => setFilters(f => ({...f, premMin:-20, premMax:50}))}>重設</button>
        </div>
        <DualSlider
          min={-20} max={50} step={1}
          valMin={filters.premMin} valMax={filters.premMax}
          onChange={([a,b]) => setFilters(f => ({...f, premMin:a, premMax:b}))}
          fmtLabel={(a,b) => `${a}% ~ ${b}%`}
        />
      </div>

      {/* CB價格 */}
      <div>
        <div className="filter-label" style={{marginBottom:4}}>
          CB 價格範圍
          <button className="reset-btn" onClick={() => setFilters(f => ({...f, cbMin:80, cbMax:200}))}>重設</button>
        </div>
        <DualSlider
          min={80} max={200} step={1}
          valMin={filters.cbMin} valMax={filters.cbMax}
          onChange={([a,b]) => setFilters(f => ({...f, cbMin:a, cbMax:b}))}
          fmtLabel={(a,b) => `${a} ~ ${b}`}
        />
      </div>

      {/* 5日均量 */}
      <div>
        <div className="filter-label" style={{marginBottom:4}}>
          5日均量下限
          <button className="reset-btn" onClick={() => setFilters(f => ({...f, vol5Min:0}))}>重設</button>
        </div>
        <MinSlider
          min={0} max={500} step={10}
          value={filters.vol5Min}
          onChange={v => setFilters(f => ({...f, vol5Min:v}))}
          fmtLabel={v => v === 0 ? "不限" : `≥ ${v} 張`}
        />
      </div>

      {hasChange && (
        <div style={{display:"flex", alignItems:"flex-end"}}>
          <button className="reset-btn" style={{color:"#fb7185", fontSize:12}} onClick={reset}>
            ✕ 全部重設
          </button>
        </div>
      )}
    </div>
  );
}

function App() {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [activeTab, setActiveTab] = useState(null);
  const [sortKey, setSortKey] = useState("溢價率");
  const [sortDir, setSortDir] = useState("asc");
  const [search, setSearch] = useState("");
  const [showFilters, setShowFilters] = useState(true);
  const [filters, setFilters] = useState(DEFAULT_FILTERS);

  useEffect(() => {
    fetch(DATA_URL)
      .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(json => {
        setData(json);
        const keys = Object.keys(json.strategies || {});
        if (keys.length) setActiveTab(keys[0]);
      })
      .catch(e => setError("無法載入資料：" + e.message + "\n請確認 GitHub Actions 已執行並產生 latest.json。"))
      .finally(() => setLoading(false));
  }, []);

  const doSort = (key) => {
    if (sortKey === key) setSortDir(d => d === "asc" ? "desc" : "asc");
    else { setSortKey(key); setSortDir("asc"); }
  };

  const rows = useMemo(() => {
    if (!data || !activeTab) return [];
    const s = data.strategies[activeTab];
    if (!s || !s.data) return [];
    let arr = [...s.data];

    // 文字搜尋
    if (search) {
      const q = search.toLowerCase();
      arr = arr.filter(r =>
        String(r["代號"]||"").toLowerCase().includes(q) ||
        String(r["債券名稱"]||"").toLowerCase().includes(q) ||
        String(r["股票代號"]||"").toLowerCase().includes(q)
      );
    }

    // 滑桿篩選
    arr = arr.filter(r => {
      const prem = r["溢價率"];
      if (prem != null && !isNaN(prem)) {
        const pct = prem * 100;
        if (pct < filters.premMin || pct > filters.premMax) return false;
      }
      const cb = r["債券市價"];
      if (cb != null && !isNaN(cb)) {
        if (cb < filters.cbMin || cb > filters.cbMax) return false;
      }
      const vol = r["CB均量5日"];
      if (filters.vol5Min > 0 && (vol == null || isNaN(vol) || vol < filters.vol5Min)) return false;
      return true;
    });

    arr.sort((a, b) => {
      let va = a[sortKey], vb = b[sortKey];
      if (va == null) va = sortDir === "asc" ? Infinity : -Infinity;
      if (vb == null) vb = sortDir === "asc" ? Infinity : -Infinity;
      if (typeof va === "string") return sortDir === "asc" ? va.localeCompare(vb) : vb.localeCompare(va);
      return sortDir === "asc" ? va - vb : vb - va;
    });
    return arr;
  }, [data, activeTab, sortKey, sortDir, search, filters]);

  const strategies = data ? Object.keys(data.strategies || {}) : [];
  const hasActiveFilters = JSON.stringify(filters) !== JSON.stringify(DEFAULT_FILTERS);

  if (loading) return (
    <div className="loading">
      <div className="spinner" />
      <p style={{color:"#64748b",fontSize:12,letterSpacing:2}}>載入中...</p>
    </div>
  );

  if (error) return (
    <div className="error-box">
      <div className="error-card">
        <div className="icon">⚠️</div>
        <p>{error}</p>
      </div>
    </div>
  );

  return (
    <div>
      <header className="header">
        <div className="header-inner">
          <div>
            <div className="title"><span>◆</span>可轉債篩選器</div>
            {data.date && <div className="subtitle">資料日期：{data.date}{data.updated_at ? ` · 更新 ${data.updated_at}` : ""}</div>}
          </div>
          <div className="badge">{rows.length} 檔</div>
        </div>
      </header>

      <div className="container">
        <div className="toolbar">
          <div className="tabs">
            {strategies.map(s => (
              <div key={s} className={`tab ${s === activeTab ? "active" : ""}`} onClick={() => setActiveTab(s)}>
                {s}<span className="tab-count">{data.strategies[s]?.count || 0}</span>
              </div>
            ))}
          </div>
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            <button
              className={`filter-toggle ${showFilters ? "active" : ""}`}
              onClick={() => setShowFilters(v => !v)}
            >
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="4" y1="6" x2="11" y2="6"/><line x1="20" y1="6" x2="13" y2="6"/><circle cx="12" cy="6" r="2"/><line x1="4" y1="12" x2="7" y2="12"/><line x1="20" y1="12" x2="10" y2="12"/><circle cx="8.5" cy="12" r="2"/><line x1="4" y1="18" x2="13" y2="18"/><line x1="20" y1="18" x2="15" y2="18"/><circle cx="14" cy="18" r="2"/></svg>
              篩選{hasActiveFilters ? " •" : ""}
            </button>
            <div className="search-box">
              <svg className="search-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
              <input placeholder="搜尋代號或名稱..." value={search} onChange={e => setSearch(e.target.value)} />
            </div>
          </div>
        </div>

        {showFilters && (
          <FilterPanel filters={filters} setFilters={setFilters} rawData={data} />
        )}

        <div className="legend">
          <span><span className="legend-dot" style={{background:"#34d399"}} />折價</span>
          <span><span className="legend-dot" style={{background:"#fbbf24"}} />微溢價(&lt;5%)</span>
          <span><span className="legend-dot" style={{background:"#fb7185"}} />溢價</span>
        </div>

        <div className="table-wrap">
          <div className="table-scroll">
            <table>
              <thead>
                <tr>
                  {COLUMNS.map(c => (
                    <th key={c.key}
                        className={(c.sortable ? "sortable " : "") + (c.num ? "num" : "")}
                        onClick={c.sortable ? () => doSort(c.key) : undefined}>
                      {c.label}
                      {c.sortable && (sortKey === c.key
                        ? <span className="sort-arrow">{sortDir === "asc" ? "↑" : "↓"}</span>
                        : <span className="sort-arrow-dim">↕</span>)}
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {rows.length === 0 ? (
                  <tr><td colSpan={COLUMNS.length} className="empty">{search ? "沒有符合搜尋條件的結果" : "沒有符合條件的可轉債"}</td></tr>
                ) : rows.map((row, i) => {
                  const p = row["溢價率"];
                  return (
                    <tr key={row["代號"]||i} className={premRowClass(p)}>
                      {COLUMNS.map(c => {
                        const v = row[c.key];
                        let display = fmtVal(v, c.fmt);
                        let cls = c.num ? "num" : "";
                        if (c.key === "溢價率") cls += " " + premColor(v);
                        if (c.key === "有擔保") display = v === "有" ? "🛡" : "";
                        if (c.key === "代號") cls += " code";
                        return <td key={c.key} className={cls}>{display}</td>;
                      })}
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>

        <div className="footer">
          <p>資料來源：統一證券 CBAS API · 均線：yfinance</p>
          <p>策略篩選 + Telegram 推播 · GitHub Actions 自動化</p>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
